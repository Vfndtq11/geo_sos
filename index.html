<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    .sos-button {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff3b30, #d32f2f);
      border: none;
      color: white;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 25px rgba(255, 59, 48, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: pulse 2s infinite;
    }
    .sos-button:active {
      transform: scale(0.95);
      box-shadow: 0 0 15px rgba(255, 59, 48, 0.8);
    }
    .status {
      margin-top: 25px;
      font-size: 16px;
      min-height: 24px;
      color: #aaaaaa;
    }
    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
      }
      70% {
        box-shadow: 0 0 0 25px rgba(255, 59, 48, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="sos-button" id="sosBtn">SOS</button>
    <div class="status" id="statusText">Нажми в случае опасности</div>
  </div>

  <script>
    // НАСТРОЙКИ (вставь свои данные):
    const BOT_TOKEN = "8948325639:AAFn-M8n173hHJ3xxe7FoLQhDKWw1TERGlA";
    const CHAT_ID = "-1003994664111"; // Можно указывать твой ID или ID группы с другом

    const sosBtn = document.getElementById('sosBtn');
    const statusText = document.getElementById('statusText');

    sosBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        statusText.textContent = "Геолокация не поддерживается вашим браузером";
        return;
      }

      statusText.textContent = "Получение координат...";
      sosBtn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          sendToTelegram(lat, lon);
        },
        (error) => {
          sosBtn.disabled = false;
          switch(error.code) {
            case error.PERMISSION_DENIED:
              statusText.textContent = "Ошибка: Доступ к геолокации запрещен";
              break;
            default:
              statusText.textContent = "Не удалось определить местоположение";
              break;
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    });

    async function sendToTelegram(lat, lon) {
      statusText.textContent = "Отправка сигнала тревоги...";

      const mapsUrl = https://www.google.com/maps?q=${lat},${lon};
      const text = 🚨 *СИГНАЛ SOS!* 🚨\n\nТребуется помощь!\nЛокация: [Открыть на карте](${mapsUrl});

      try {
        const response = await fetch(https://api.telegram.org/bot${BOT_TOKEN}/sendMessage, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text,
            parse_mode: 'Markdown'
          })
        });

        if (response.ok) {
          statusText.textContent = "Сигнал SOS отправлен!";
          statusText.style.color = "#4cd964";
        } else {
          throw new Error('Ошибка сети');
        }
      } catch (err) {
        statusText.textContent = "Ошибка при отправке сигнала";
        statusText.style.color = "#ff3b30";
      } finally {
        sosBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
